name: Logia Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Catches the two ways a tag can ship the wrong thing, before any build time is spent.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag matches every version number
        run: |
          want="${GITHUB_REF_NAME#v}"
          status=0
          check() {
            if [ "$2" != "$want" ]; then
              echo "::error file=$1::$1 says $2, tag says $want"
              status=1
            fi
          }
          check package.json "$(jq -r .version package.json)"
          check src-tauri/tauri.conf.json "$(jq -r .version src-tauri/tauri.conf.json)"
          check src-tauri/Cargo.toml "$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          check flake.nix "$(sed -n 's/^ *version = "\(.*\)";/\1/p' flake.nix | head -1)"
          exit $status

      # The Nix package serves the committed dist/, so a stale one ships an old interface.
      - name: Committed dist is at least as new as src
        run: |
          src=$(git log -1 --format=%ct -- src)
          dist=$(git log -1 --format=%ct -- dist)
          if [ "$src" -gt "$dist" ]; then
            echo "::error::src/ changed after dist/ was last rebuilt. Run bun run build and commit dist/."
            exit 1
          fi

  # Proves `nix run github:daschinmoy21/Logia/<tag>` works before the release goes public.
  nix:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix build .#default --no-link --print-build-logs

  build:
    needs: verify
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon Mac
          - os: macos-latest
            target: aarch64-apple-darwin

          # Linux AppImage
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Rust
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Bun (Windows)
      - name: Install Bun (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          irm bun.sh/install.ps1|iex
          echo "$env:USERPROFILE\.bun\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Bun (Unix)
      - name: Install Bun (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      # Linux system deps
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      # Frontend deps
      - name: Install frontend deps
        run: bun install

      # Build + Release
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Logia ${{ github.ref_name }}"
          releaseBody: "See attached assets."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  # Builds publish to a draft. It goes public only if every platform and Nix succeeded, so a
  # partial failure can't become the latest release.
  publish:
    needs: [nix, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
