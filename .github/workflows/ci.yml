name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run check
      - name: Workspace and agent tests
        run: bun run test:unit && bun run test:agent
      - name: Install test browser
        run: bunx playwright install --with-deps chromium
      - name: Browser tests
        run: bun run test:browser

  rust:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLIENT_ID: ci-dummy
      GOOGLE_CLIENT_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Interactive terminal lifecycle tests (no GUI)
        run: cargo test --manifest-path src-tauri/terminal-tests/Cargo.toml --locked
      - name: Local CLI transport tests (no GUI)
        run: cargo test --manifest-path src-tauri/cli-tests/Cargo.toml --locked
      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
